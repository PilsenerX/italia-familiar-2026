<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Italia Familiar 2026</title>
<style>
  :root { color-scheme: light; --ink:#1c1917; --muted:#78716c; --card:#fff; --bg:#f5f0e8; --accent:#0f766e; --danger:#b91c1c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%), radial-gradient(900px 500px at 100% 0%, #fde68a 0%, transparent 45%), var(--bg); color: var(--ink); }
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { width: min(400px, 100%); background: var(--card); border-radius: 20px; padding: 28px 24px 22px; box-shadow: 0 20px 50px rgba(28,25,23,.12); border: 1px solid rgba(28,25,23,.06); }
  .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  h1 { margin: 8px 0 6px; font-size: 1.45rem; line-height: 1.25; }
  p { margin: 0 0 18px; color: var(--muted); font-size: .95rem; line-height: 1.45; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font-size: 1.25rem; letter-spacing: .2em; padding: 14px; border-radius: 12px; border: 1px solid #d6d3d1; outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,118,110,.15); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  button { flex: 1; border: 0; border-radius: 12px; padding: 13px 14px; font-weight: 700; font-size: 1rem; cursor: pointer; background: var(--accent); color: white; }
  button:disabled { opacity: .6; cursor: wait; }
  .ghost { background: #f5f5f4; color: var(--ink); flex: 0 0 auto; width: 48px; }
  .err { color: var(--danger); font-size: .9rem; min-height: 1.2em; margin-top: 10px; }
  .hint { margin-top: 14px; font-size: .78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="gate">
  <form class="card" id="form" autocomplete="off">
    <div class="kicker">Itinerario familiar</div>
    <h1>Italia 2026</h1>
    <p>Ingresa el PIN para ver el plan del viaje.</p>
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autofocus required>
    <div class="row">
      <button type="submit" id="go">Abrir</button>
      <button type="button" class="ghost" id="toggle" title="Mostrar/ocultar" aria-label="Mostrar PIN">👁</button>
    </div>
    <div class="err" id="err" aria-live="polite"></div>
    <div class="hint">El contenido va cifrado en el navegador. Sin el PIN no se puede leer.</div>
  </form>
</div>

function b64(s){const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function deriveKey(pin,salt,iterations){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unlock(pin){const salt=b64(PAYLOAD.salt);const iv=b64(PAYLOAD.iv);const ct=b64(PAYLOAD.ct);const key=await deriveKey(pin,salt,PAYLOAD.iter);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}
const form=document.getElementById('form');const pinEl=document.getElementById('pin');const err=document.getElementById('err');const go=document.getElementById('go');
document.getElementById('toggle').onclick=()=>{pinEl.type=pinEl.type==='password'?'text':'password'};
form.addEventListener('submit',async(e)=>{e.preventDefault();err.textContent='';go.disabled=true;try{await unlock(pinEl.value.trim())}catch(ex){err.textContent='PIN incorrecto. Intenta de nuevo.';pinEl.select();go.disabled=false}});
</script>
